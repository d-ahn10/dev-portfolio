<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to my portfolio site. Enter the password to continue to the main page.">
    <title>Portfolio Access</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <main class="gate">
        <section class="card">
            <h1>Welcome to my portfolio site</h1>
            <p class="subtitle">Work in progress. Enter the password to view the full portfolio.</p>
            <form id="gate-form" class="form">
                <label for="password">Password</label>
                <div class="input-row">
                    <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
                    <button id="enter-button" type="submit">Enter</button>
                </div>
                <p id="error-message" class="error" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="/assets/js/gate.js"></script>
</body>
</html>
